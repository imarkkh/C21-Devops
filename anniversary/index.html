<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question For You… 💌</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
<style>
  :root {
    --bg: #14090f;
    --bg-soft: #1e0e16;
    --card: #261219;
    --rose: #ff5e8a;
    --rose-soft: #ff9db8;
    --gold: #f5c77e;
    --text: #fdf0f4;
    --muted: #c79aa9;
    --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100svh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #hearts-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .stage {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem 1.25rem;
    max-width: 720px;
    width: 100%;
    background:
      radial-gradient(ellipse 80% 55% at 50% -10%, rgba(255, 94, 138, 0.18), transparent);
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.35em;
    font-size: 0.78rem;
    color: var(--gold);
    margin-bottom: 1.4rem;
    animation: fadeUp 1s ease both;
  }

  .envelope {
    font-size: 3.4rem;
    margin-bottom: 1.4rem;
    animation: fadeUp 1s 0.15s ease both, wiggle 2.4s 1.4s ease-in-out infinite;
    display: inline-block;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.9rem, 6.5vw, 3.4rem);
    line-height: 1.2;
    animation: fadeUp 1s 0.3s ease both;
  }

  h1 .again {
    color: var(--rose);
    font-style: italic;
  }

  .subtitle {
    margin-top: 1.1rem;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1rem, 2.8vw, 1.25rem);
    color: var(--rose-soft);
    animation: fadeUp 1s 0.45s ease both;
  }

  .buttons {
    margin-top: 3rem;
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    min-height: 76px;
    animation: fadeUp 1s 0.6s ease both;
  }

  .btn {
    font-family: var(--sans);
    font-size: 1.15rem;
    font-weight: 600;
    border: none;
    border-radius: 999px;
    padding: 0.95em 2.2em;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  #btn-yes {
    background: linear-gradient(135deg, var(--rose), #ff2e6c);
    color: white;
    box-shadow: 0 10px 34px rgba(255, 94, 138, 0.45);
  }
  #btn-yes:hover { transform: scale(1.06); box-shadow: 0 14px 44px rgba(255, 94, 138, 0.65); }

  #btn-no {
    background: rgba(255, 255, 255, 0.07);
    color: var(--muted);
    border: 1px solid rgba(255, 255, 255, 0.16);
    position: relative;
  }
  #btn-no.fleeing { position: fixed; z-index: 5; transition: left 0.22s ease, top 0.22s ease; }

  .hint {
    margin-top: 2.2rem;
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.6s;
  }
  .hint.show { opacity: 0.8; }

  /* ---------- Celebration ---------- */
  .celebration {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(10, 4, 8, 0.97);
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }
  .celebration.show { display: flex; }
  .celebration .inner { animation: pop 0.7s cubic-bezier(0.2, 1.6, 0.4, 1) both; max-width: 640px; }
  .celebration .big { font-size: 4.6rem; animation: beat 1.4s ease-in-out infinite; }
  .celebration h2 {
    font-family: var(--serif);
    font-size: clamp(2rem, 7vw, 3.4rem);
    margin-top: 1rem;
  }
  .celebration p {
    color: var(--rose-soft);
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.2rem;
    margin-top: 0.8rem;
  }
  .celebration a {
    display: inline-block;
    margin-top: 2.2rem;
    background: linear-gradient(135deg, var(--rose), #ff2e6c);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
    border-radius: 999px;
    padding: 0.95em 2.4em;
    box-shadow: 0 10px 34px rgba(255, 94, 138, 0.45);
    transition: transform 0.18s ease;
  }
  .celebration a:hover { transform: scale(1.06); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    8%  { transform: rotate(-8deg); }
    16% { transform: rotate(8deg); }
    24% { transform: rotate(-5deg); }
    32% { transform: rotate(0); }
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.25); }
    28% { transform: scale(1); }
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<canvas id="hearts-canvas"></canvas>

<div class="stage">
  <p class="eyebrow">I have something to ask you…</p>
  <div class="envelope">💌</div>
  <h1 id="question">Tabbey, will you be my girlfriend… <span class="again">again?</span></h1>
  <p class="subtitle">Three years in, and I'd still choose you. Every single time.</p>

  <div class="buttons">
    <button class="btn" id="btn-yes">Yes! ❤️</button>
    <button class="btn" id="btn-no">No</button>
  </div>
  <p class="hint" id="hint">The "No" button seems a little shy… 😌</p>
</div>

<div class="celebration" id="celebration">
  <div class="inner">
    <div class="big">❤️</div>
    <h2>She said YES!</h2>
    <p>Best decision ever. (Again.) Now come see what three years of us looks like…</p>
    <a href="anniversary.html">Our 3 years together →</a>
  </div>
</div>

<script>
/* ================================================================
   💗 EDIT THIS PART
   ================================================================ */
const ASK = {
  herName: "Tabbey",                       // her name, used in the big question
  subtitle: "Three years in, and I'd still choose you. Every single time.",

  // What the "No" button says each time she tries to press it 😄
  noTexts: ["No", "Are you sure?", "Really?? 🥺", "Think again!", "Last chance…", "Wrong button 😌", "You can't catch me!"]
};

/* ================================================================
   Machinery below — no need to touch it.
   ================================================================ */
document.getElementById('question').innerHTML =
  `${ASK.herName}, will you be my girlfriend… <span class="again">again?</span>`;
document.querySelector('.subtitle').textContent = ASK.subtitle;

/* ---------- The shy "No" button ---------- */
const btnNo = document.getElementById('btn-no');
const btnYes = document.getElementById('btn-yes');
const hint = document.getElementById('hint');
let dodges = 0;

function placeRandomly() {
  // Jump somewhere random on screen, always fully visible
  const pad = 16;
  const w = btnNo.offsetWidth, h = btnNo.offsetHeight;
  const maxX = Math.max(pad, window.innerWidth - w - pad);
  const maxY = Math.max(pad, window.innerHeight - h - pad);
  const x = Math.min(maxX, Math.max(pad, pad + Math.random() * (maxX - pad)));
  const y = Math.min(maxY, Math.max(pad, pad + Math.random() * (maxY - pad)));
  btnNo.style.left = x + 'px';
  btnNo.style.top = y + 'px';
}

function dodge() {
  dodges++;
  hint.classList.add('show');

  // Grow the Yes button a little every time she tries to say no
  btnYes.style.transform = `scale(${Math.min(1 + dodges * 0.08, 1.8)})`;

  // Cycle the teasing text
  btnNo.textContent = ASK.noTexts[Math.min(dodges, ASK.noTexts.length - 1)];

  // Move the button to <body> when it starts fleeing: ancestors with CSS
  // animations break position:fixed, which sent it flying off-screen.
  if (!btnNo.classList.contains('fleeing')) {
    btnNo.classList.add('fleeing');
    document.body.appendChild(btnNo);
  }
  placeRandomly();
}

// If the screen size changes (phone rotation etc.), pull the button back in view
window.addEventListener('resize', () => {
  if (btnNo.classList.contains('fleeing')) placeRandomly();
});

btnNo.addEventListener('mouseenter', dodge);
btnNo.addEventListener('touchstart', e => { e.preventDefault(); dodge(); }, { passive: false });
btnNo.addEventListener('click', e => { e.preventDefault(); dodge(); });

/* ---------- YES! ---------- */
btnYes.addEventListener('click', () => {
  document.getElementById('celebration').classList.add('show');
  burstHearts();
  try { localStorage.setItem('saidYes', new Date().toISOString()); } catch (e) {}
});

/* ---------- Floating + bursting hearts ---------- */
const canvas = document.getElementById('hearts-canvas');
const ctx = canvas.getContext('2d');
let hearts = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function spawnHeart(burst) {
  const h = {
    x: burst ? canvas.width / 2 : Math.random() * canvas.width,
    y: burst ? canvas.height / 2 : canvas.height + 20,
    size: 8 + Math.random() * (burst ? 22 : 14),
    speed: burst ? 0 : 0.3 + Math.random() * 0.7,
    vx: burst ? (Math.random() - 0.5) * 14 : 0,
    vy: burst ? -4 - Math.random() * 10 : 0,
    drift: (Math.random() - 0.5) * 0.4,
    alpha: burst ? 0.9 : 0.15 + Math.random() * 0.3,
    burst: !!burst,
    wobble: Math.random() * Math.PI * 2
  };
  hearts.push(h);
}

function burstHearts() {
  for (let i = 0; i < 80; i++) spawnHeart(true);
}

function drawHeart(h) {
  ctx.save();
  ctx.translate(h.x + Math.sin(h.wobble) * 12, h.y);
  ctx.scale(h.size / 16, h.size / 16);
  ctx.globalAlpha = Math.max(0, h.alpha);
  ctx.fillStyle = '#ff5e8a';
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.bezierCurveTo(-8, -4, -16, 2, 0, 14);
  ctx.bezierCurveTo(16, 2, 8, -4, 0, 4);
  ctx.fill();
  ctx.restore();
}

function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (hearts.length < 26 && Math.random() < 0.08) spawnHeart(false);
  hearts.forEach(h => {
    if (h.burst) {
      h.x += h.vx;
      h.y += h.vy;
      h.vy += 0.25;          // gravity
      h.alpha -= 0.008;
    } else {
      h.y -= h.speed;
      h.x += h.drift;
    }
    h.wobble += 0.02;
  });
  hearts = hearts.filter(h => h.y > -30 && h.y < canvas.height + 60 && h.alpha > 0);
  hearts.forEach(drawHeart);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
